<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBF Rentals</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Baloo+2:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        h1,
        h2,
        h3 {
            font-family: 'Baloo 2', cursive;
        }

        /* Top Bar */
        .top-bar {
            background: #c00;
            /* red */
            color: #fff;
            font-size: 14px;
            padding: 12px 0;
        }

        .top-bar a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }

        .top-bar i {
            margin-right: 5px;
        }

        /* Social Icons Circle */
        .social-links a {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 28px;
            height: 28px;
            background: black;
            color: #c00;
            border-radius: 50%;
            margin: 0 4px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background: #900;
            color: #fff;
        }

        /* Navbar */
        .navbar {
            background: #fff;
        }

        .navbar-brand img {
            height: 50px;
        }

        .navbar-nav .nav-link.active {
            color: red !important;
            font-weight: 600;
        }

        .breadcrumb {
            background: transparent;
            /* remove gray background */
            margin: 0;
            padding: 0;
        }

        .breadcrumb-item+.breadcrumb-item::before {
            content: ">>";
            /* arrow */
            color: #6c757d;
            /* muted arrow color */
            padding: 0 8px;
        }

        .breadcrumb-item a {
            text-decoration: none;
            color: #000;
        }

        .breadcrumb-item a:hover {
            text-decoration: underline;
        }

        .products {
            background-color: #91939412;
        }


        .product-list {
            list-style: none;
            padding: 0;
            margin: 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }

        .product-list li {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid #eee;
        }

        .product-list li:last-child {
            border-bottom: none;
        }

        .product-header {
            background: #ffffff;
            font-weight: 600;
            color: #333;
        }

        .product-list p,
        .product-list img,
        .product-list a {
            flex: 1;
            margin: 0;
            text-align: center;
        }

        .product-list img {
            width: 8%;
            height: 100px;
            object-fit: contain;
        }

        .product-list a {
            color: #d40000;
            font-weight: 500;
        }

        .product-list a:hover {
            text-decoration: underline;
        }

        /* Pagination */
        .pagination .page-item .page-link {
            color: #333;
            border-radius: 14px;
            margin: 0 4px;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pagination .page-item.active .page-link {
            background-color: #d40000;
            border-color: #d40000;
            color: #fff;
        }

        .product-row {
            border-top: 2px solid #91939412;
        }

        /* Mobile responsive fixes */
        @media (max-width: 768px) {
            .product-list li {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                padding: 12px;
            }

            .product-list img {
                width: 100%;
                height: auto;
                margin-bottom: 10px;
            }

            .product-list p,
            .product-list a {
                flex: unset;
                width: 100%;
                text-align: left;
                margin-bottom: 6px;
            }

            .product-list a {
                display: inline-block;
                font-weight: 600;
            }

            /* Make product list vertically scrollable */
            .products {
                max-height: 70vh;
                /* fits most screens */
                overflow-y: auto;
                padding: 12px;
            }

            /* Hide sticky header row on mobile (optional) */
            .product-header {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Top Contact Bar -->
    <div class="top-bar">
        <div class="container-fluid">
            <div class="d-flex flex-column flex-md-row justify-content-md-end align-items-center">
                <!-- Contact Links -->
                <div class="contact-links mb-2 mb-md-0 me-md-3 text-center text-md-start">
                    <a href="mailto:admin@bbformwork.com"><i class="fas fa-envelope"></i>admin@bbformwork.com</a>
                    <a href="tel:+91 94426 06366"><i class="fas fa-phone"></i> +91 94426 06366</a>
                </div>

                <!-- Social Links -->
                <div class="social-links text-center text-md-end">
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>

            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light shadow-sm">
        <div class="container">
            <!-- Logo as image -->
            <a class="navbar-brand" href="#">
                <img src="assets/logo.png" alt="BBF Rentals Logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="./home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="./about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="./products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="./gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="./contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="products p-5 mx-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="#">Home</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="./products.html">Products</a>
                </li>
                <li class="breadcrumb-item active text-danger fw-bold" aria-current="page">
                    Cuplock System
                </li>
            </ol>
        </nav>

        <ul class="product-list mt-4 " style="background: #f8f9fa;">
            <!-- Header Row -->
            <li class="product-header p-3">
                <p>S.No</p>
                <p>Product Image</p>
                <p>Item Code</p>
                <p>Product Name</p>
                <p>Action</p>
            </li>
            <!-- Data rows will be injected here -->
            <div id="product-rows"></div>
        </ul>

        <!-- Pagination -->
        <nav>
            <ul id="pagination" class="pagination justify-content-center mt-4"></ul>
        </nav>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Sample data (60 items)
        const products = Array.from({ length: 60 }, (_, i) => ({
            sno: i + 1,
            img: "./assets/products/11.png",
            code: "ITM00" + (100 + i),
            name: "CUPLOCK BASE JACK - DIA 32 X L 600MM",
            link: "./product_details.html"
        }));

        const rowsContainer = document.getElementById("product-rows");
        const pagination = document.getElementById("pagination");

        let currentPage = 1;
        const rowsPerPage = 10;

        function renderProducts(page) {
            currentPage = page;
            rowsContainer.innerHTML = "";

            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = products.slice(start, end);

            paginatedItems.forEach(p => {
                rowsContainer.innerHTML += `
        <li class="product-row">
          <p>${String(p.sno).padStart(2, "0")}</p>
          <img src="${p.img}" alt="${p.name}" />
          <p>${p.code}</p>
          <p>${p.name}</p>
          <a href="${p.link}" class="text-danger">View Details</a>
        </li>
      `;
            });

            renderPagination();
        }

        function renderPagination() {
            pagination.innerHTML = "";
            const pageCount = Math.ceil(products.length / rowsPerPage);

            // Prev button
            pagination.innerHTML += `
        <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
          <a class="page-link" href="javascript:void(0)" 
             onclick="${currentPage > 1 ? `renderProducts(${currentPage - 1})` : ""}">
             Prev
          </a>
        </li>`;

            if (pageCount <= 6) {
                // If few pages, just show all
                for (let i = 1; i <= pageCount; i++) {
                    pagination.innerHTML += `
            <li class="page-item ${i === currentPage ? "active" : ""}">
              <a class="page-link" href="javascript:void(0)" onclick="renderProducts(${i})">${i}</a>
            </li>`;
                }
            } else {
                if (currentPage <= 3) {
                    // Show first 3 pages, then dots, then last
                    for (let i = 1; i <= 3; i++) {
                        pagination.innerHTML += `
                <li class="page-item ${i === currentPage ? "active" : ""}">
                  <a class="page-link" href="javascript:void(0)" onclick="renderProducts(${i})">${i}</a>
                </li>`;
                    }
                    pagination.innerHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                    pagination.innerHTML += `
            <li class="page-item ${pageCount === currentPage ? "active" : ""}">
              <a class="page-link" href="javascript:void(0)" onclick="renderProducts(${pageCount})">${pageCount}</a>
            </li>`;
                } else if (currentPage >= pageCount - 2) {
                    // Show first, dots, then last 3 pages
                    pagination.innerHTML += `
            <li class="page-item ${1 === currentPage ? "active" : ""}">
              <a class="page-link" href="javascript:void(0)" onclick="renderProducts(1)">1</a>
            </li>`;
                    pagination.innerHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                    for (let i = pageCount - 2; i <= pageCount; i++) {
                        pagination.innerHTML += `
                <li class="page-item ${i === currentPage ? "active" : ""}">
                  <a class="page-link" href="javascript:void(0)" onclick="renderProducts(${i})">${i}</a>
                </li>`;
                    }
                } else {
                    // Show first, dots, current-1, current, current+1, dots, last
                    pagination.innerHTML += `
            <li class="page-item ${1 === currentPage ? "active" : ""}">
              <a class="page-link" href="javascript:void(0)" onclick="renderProducts(1)">1</a>
            </li>`;
                    pagination.innerHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;

                    for (let i = currentPage - 1; i <= currentPage + 1; i++) {
                        pagination.innerHTML += `
                <li class="page-item ${i === currentPage ? "active" : ""}">
                  <a class="page-link" href="javascript:void(0)" onclick="renderProducts(${i})">${i}</a>
                </li>`;
                    }

                    pagination.innerHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                    pagination.innerHTML += `
            <li class="page-item ${pageCount === currentPage ? "active" : ""}">
              <a class="page-link" href="javascript:void(0)" onclick="renderProducts(${pageCount})">${pageCount}</a>
            </li>`;
                }
            }

            // Next button
            pagination.innerHTML += `
        <li class="page-item ${currentPage === pageCount ? "disabled" : ""}">
          <a class="page-link" href="javascript:void(0)" 
             onclick="${currentPage < pageCount ? `renderProducts(${currentPage + 1})` : ""}">
             Next
          </a>
        </li>`;
        }


        // Initial render
        renderProducts(1);
    </script>
</body>

</html>
